<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — SOT Stash Or Trash</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2rem;
      border: 1px solid #1f2937;
      border-radius: 1rem;
      background-color: #111827;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You are offline</h1>
    <p>Please check your internet connection and try reloading SOT.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
