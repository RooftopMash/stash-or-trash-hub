name: Preview E2E

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e-tests:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright against Preview URL
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          PROBE_URL="${TARGET_URL%/}/profile"
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            EFFECTIVE_URL=$(curl -sL -o /dev/null -w "%{url_effective}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PROBE_URL" || echo "$PROBE_URL")
          else
            EFFECTIVE_URL=$(curl -sL -o /dev/null -w "%{url_effective}" "$PROBE_URL" || echo "$PROBE_URL")
          fi
          if echo "$EFFECTIVE_URL" | grep -qE '^https://vercel\.com/login'; then
            echo "Preview URL is behind Vercel SSO protection; running E2E against local app instead."
            npm run build
            npx playwright test
          else
            BASE_URL="$TARGET_URL" npx playwright test
          fi
