name: Preview E2E

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e-tests:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.target_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright against Preview URL
        env:
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          PROBE_URL="${TARGET_URL%/}/profile"
          BODY_FILE="/tmp/preview-probe.html"
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            CURL_META=$(curl -sL -o "$BODY_FILE" -w "%{http_code}|%{url_effective}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PROBE_URL" || echo "000|$PROBE_URL")
          else
            CURL_META=$(curl -sL -o "$BODY_FILE" -w "%{http_code}|%{url_effective}" "$PROBE_URL" || echo "000|$PROBE_URL")
          fi
          HTTP_CODE="${CURL_META%%|*}"
          EFFECTIVE_URL="${CURL_META#*|}"
          if [ "$HTTP_CODE" -ge 400 ] || echo "$EFFECTIVE_URL" | grep -qE 'vercel\.com/login|sso-api' || grep -qiE 'vercel\.com/login|sso-api|Authentication Required' "$BODY_FILE" 2>/dev/null; then
            echo "Preview URL is behind Vercel Deployment Protection / SSO (status=$HTTP_CODE); running E2E against local app instead."
            npm run build
            npx playwright test
          else
            BASE_URL="$TARGET_URL" npx playwright test
          fi
